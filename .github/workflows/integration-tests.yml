name: Integration Tests

on:
  # Trigger when a status check is posted (OpenShift CI completion)
  status:
  # Allow manual trigger with custom image tag
  workflow_dispatch:
    inputs:
      image_tag:
        description: 'Image tag to test (e.g., pr-123)'
        required: true
        type: string
      test_ref:
        description: 'Git ref to checkout for tests (branch, tag, or commit SHA)'
        required: true
        type: string

jobs:
  # Extract image information from the trigger event
  setup:
    name: Determine Image Tag
    runs-on: ubuntu-latest
    # Only run for workflow_dispatch or relevant status events
    if: |
      github.event_name == 'workflow_dispatch' ||
      (github.event_name == 'status' &&
       github.event.state == 'success' &&
       contains(github.event.context, 'stable-pr-image-mirror'))
    outputs:
      image_tag: ${{ steps.set_image_tag.outputs.tag }}
      checkout_ref: ${{ steps.set_checkout_ref.outputs.ref }}
    steps:
      - name: Get PR information
        if: github.event_name == 'status'
        id: get_pr_info
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          COMMIT_SHA="${{ github.event.sha }}"
          echo "Finding PRs for commit: ${COMMIT_SHA}"

          # Find open PRs targeting stable or stable-2.x branches
          MATCHING_PRS=$(gh api "repos/${{ github.repository }}/commits/${COMMIT_SHA}/pulls" \
            --jq '[.[] | select(.state == "open" and (.base.ref == "stable" or .base.ref == "stable-2.x"))]')

          PR_COUNT=$(echo "${MATCHING_PRS}" | jq 'length')

          if [[ "${PR_COUNT}" -eq 0 ]]; then
            echo "No open PRs targeting stable or stable-2.x branches found for commit ${COMMIT_SHA}"
            exit 1
          elif [[ "${PR_COUNT}" -gt 1 ]]; then
            echo "ERROR: Multiple open PRs found targeting stable branches for commit ${COMMIT_SHA}:"
            echo "${MATCHING_PRS}" | jq -r '.[] | "  - PR #\(.number): \(.head.ref) -> \(.base.ref)"'
            echo ""
            echo "Please consolidate these PRs before proceeding. Only one PR targeting stable branches should contain this commit."
            exit 1
          fi

          PR_NUM=$(echo "${MATCHING_PRS}" | jq -r '.[0].number')
          BASE_BRANCH=$(echo "${MATCHING_PRS}" | jq -r '.[0].base.ref')

          echo "pr_number=${PR_NUM}" >> $GITHUB_OUTPUT
          echo "Found PR #${PR_NUM} targeting ${BASE_BRANCH}"

      - name: Set image tag
        id: set_image_tag
        run: |
          if [[ "${{ github.event_name }}" == "workflow_dispatch" ]]; then
            echo "tag=${{ github.event.inputs.image_tag }}" >> $GITHUB_OUTPUT
          else
            echo "tag=pr-${{ steps.get_pr_info.outputs.pr_number }}" >> $GITHUB_OUTPUT
          fi

      - name: Set checkout ref
        id: set_checkout_ref
        run: |
          if [[ "${{ github.event_name }}" == "workflow_dispatch" ]]; then
            echo "ref=${{ github.event.inputs.test_ref }}" >> $GITHUB_OUTPUT
          else
            echo "ref=${{ github.event.sha }}" >> $GITHUB_OUTPUT
          fi

  # Pull the image built by OpenShift CI
  pull-image:
    name: Pull Image from Quay.io
    runs-on: ubuntu-latest
    needs: setup
    steps:
      - name: Pull image from Quay.io
        env:
          IMAGE_TAG: ${{ needs.setup.outputs.image_tag }}
        run: |
          FULL_IMAGE="quay.io/bretthom/openvino_model_server:${IMAGE_TAG}"
          echo "Pulling image: ${FULL_IMAGE}"
          docker pull ${FULL_IMAGE}
          docker tag ${FULL_IMAGE} openvino/model_server:latest

      - name: Save Docker image
        run: |
          docker save openvino/model_server:latest | gzip > model-server-image.tar.gz

      - name: Upload image artifact
        uses: actions/upload-artifact@v4
        with:
          name: model-server-image
          path: model-server-image.tar.gz
          retention-days: 1

  # File integrity test
  file-integrity:
    name: File Integrity Test
    runs-on: ubuntu-latest
    needs: [setup, pull-image]
    steps:
      - name: Post pending status to commit
        if: github.event_name == 'status'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh api repos/${{ github.repository }}/statuses/${{ needs.setup.outputs.checkout_ref }} \
            -f state=pending \
            -f context="File Integrity Test" \
            -f description="Running file integrity tests..." \
            -f target_url="${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"

      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          ref: ${{ needs.setup.outputs.checkout_ref }}

      - name: Download Docker image
        uses: actions/download-artifact@v4
        with:
          name: model-server-image

      - name: Load Docker image
        run: |
          docker load < model-server-image.tar.gz

      - name: Run file integrity test
        id: test
        run: |
          make run_lib_files_test

      - name: Post success status to commit
        if: github.event_name == 'status' && success()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh api repos/${{ github.repository }}/statuses/${{ needs.setup.outputs.checkout_ref }} \
            -f state=success \
            -f context="File Integrity Test" \
            -f description="File integrity tests passed" \
            -f target_url="${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"

      - name: Post failure status to commit
        if: github.event_name == 'status' && failure()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh api repos/${{ github.repository }}/statuses/${{ needs.setup.outputs.checkout_ref }} \
            -f state=failure \
            -f context="File Integrity Test" \
            -f description="File integrity tests failed" \
            -f target_url="${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"

  # Python clients test
  clients-test:
    name: Python Clients Test
    runs-on: ubuntu-latest
    needs: [setup, pull-image]
    steps:
      - name: Post pending status to commit
        if: github.event_name == 'status'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh api repos/${{ github.repository }}/statuses/${{ needs.setup.outputs.checkout_ref }} \
            -f state=pending \
            -f context="Python Clients Test" \
            -f description="Running Python client tests..." \
            -f target_url="${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"

      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          ref: ${{ needs.setup.outputs.checkout_ref }}

      - name: Download Docker image
        uses: actions/download-artifact@v4
        with:
          name: model-server-image

      - name: Load Docker image
        run: |
          docker load < model-server-image.tar.gz

      - name: Run Python clients test
        id: test
        run: |
          make test_python_clients

      - name: Post success status to commit
        if: github.event_name == 'status' && success()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh api repos/${{ github.repository }}/statuses/${{ needs.setup.outputs.checkout_ref }} \
            -f state=success \
            -f context="Python Clients Test" \
            -f description="Python client tests passed" \
            -f target_url="${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"

      - name: Post failure status to commit
        if: github.event_name == 'status' && failure()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh api repos/${{ github.repository }}/statuses/${{ needs.setup.outputs.checkout_ref }} \
            -f state=failure \
            -f context="Python Clients Test" \
            -f description="Python client tests failed" \
            -f target_url="${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"

  # Latency performance test
  latency-test:
    name: Latency Performance Test
    runs-on: ubuntu-latest
    needs: [setup, pull-image]
    steps:
      - name: Post pending status to commit
        if: github.event_name == 'status'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh api repos/${{ github.repository }}/statuses/${{ needs.setup.outputs.checkout_ref }} \
            -f state=pending \
            -f context="Latency Performance Test" \
            -f description="Running latency tests..." \
            -f target_url="${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"

      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          ref: ${{ needs.setup.outputs.checkout_ref }}

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Download Docker image
        uses: actions/download-artifact@v4
        with:
          name: model-server-image

      - name: Load Docker image
        run: |
          docker load < model-server-image.tar.gz

      - name: Run latency test
        id: test
        run: |
          make test_perf

      - name: Post success status to commit
        if: github.event_name == 'status' && success()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh api repos/${{ github.repository }}/statuses/${{ needs.setup.outputs.checkout_ref }} \
            -f state=success \
            -f context="Latency Performance Test" \
            -f description="Latency tests passed" \
            -f target_url="${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"

      - name: Post failure status to commit
        if: github.event_name == 'status' && failure()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh api repos/${{ github.repository }}/statuses/${{ needs.setup.outputs.checkout_ref }} \
            -f state=failure \
            -f context="Latency Performance Test" \
            -f description="Latency tests failed" \
            -f target_url="${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"

  # Throughput performance test
  throughput-test:
    name: Throughput Performance Test
    runs-on: ubuntu-latest
    needs: [setup, pull-image]
    steps:
      - name: Post pending status to commit
        if: github.event_name == 'status'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh api repos/${{ github.repository }}/statuses/${{ needs.setup.outputs.checkout_ref }} \
            -f state=pending \
            -f context="Throughput Performance Test" \
            -f description="Running throughput tests..." \
            -f target_url="${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"

      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          ref: ${{ needs.setup.outputs.checkout_ref }}

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Download Docker image
        uses: actions/download-artifact@v4
        with:
          name: model-server-image

      - name: Load Docker image
        run: |
          docker load < model-server-image.tar.gz

      - name: Run throughput test
        id: test
        run: |
          make test_throughput

      - name: Post success status to commit
        if: github.event_name == 'status' && success()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh api repos/${{ github.repository }}/statuses/${{ needs.setup.outputs.checkout_ref }} \
            -f state=success \
            -f context="Throughput Performance Test" \
            -f description="Throughput tests passed" \
            -f target_url="${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"

      - name: Post failure status to commit
        if: github.event_name == 'status' && failure()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh api repos/${{ github.repository }}/statuses/${{ needs.setup.outputs.checkout_ref }} \
            -f state=failure \
            -f context="Throughput Performance Test" \
            -f description="Throughput tests failed" \
            -f target_url="${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"

  # Functional smoke tests
  functional-tests-smoke:
    name: Functional Tests (Smoke)
    runs-on: ubuntu-latest
    needs: [setup, pull-image]
    steps:
      - name: Post pending status to commit
        if: github.event_name == 'status'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh api repos/${{ github.repository }}/statuses/${{ needs.setup.outputs.checkout_ref }} \
            -f state=pending \
            -f context="Functional Tests (Smoke)" \
            -f description="Running functional smoke tests..." \
            -f target_url="${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"

      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          ref: ${{ needs.setup.outputs.checkout_ref }}

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Download Docker image
        uses: actions/download-artifact@v4
        with:
          name: model-server-image

      - name: Load Docker image
        run: |
          docker load < model-server-image.tar.gz

      - name: Run functional smoke tests
        id: test
        env:
          IMAGE: openvino/model_server:latest
          TEST_PATH: "tests/functional/test_single_model.py tests/functional/test_batching.py tests/functional/test_multi_models.py -k test_run_inference"
        run: |
          make test_functional

      - name: Post success status to commit
        if: github.event_name == 'status' && success()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh api repos/${{ github.repository }}/statuses/${{ needs.setup.outputs.checkout_ref }} \
            -f state=success \
            -f context="Functional Tests (Smoke)" \
            -f description="Functional smoke tests passed" \
            -f target_url="${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"

      - name: Post failure status to commit
        if: github.event_name == 'status' && failure()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh api repos/${{ github.repository }}/statuses/${{ needs.setup.outputs.checkout_ref }} \
            -f state=failure \
            -f context="Functional Tests (Smoke)" \
            -f description="Functional smoke tests failed" \
            -f target_url="${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
