name: Functional Tests

on:
  # Trigger when a status check is posted (OpenShift CI completion)
  status:
  # Allow manual trigger with custom image tag
  workflow_dispatch:
    inputs:
      image_tag:
        description: 'Image tag to test (e.g., stable, stable-2.1)'
        required: true
        type: string
      test_ref:
        description: 'Git ref to checkout for tests (branch, tag, or commit SHA)'
        required: true
        type: string

jobs:
  # Extract image information from the trigger event
  setup:
    name: Determine Image Tag
    runs-on: ubuntu-latest
    # Only run for workflow_dispatch or relevant status events
    if: |
      github.event_name == 'workflow_dispatch' ||
      (github.event_name == 'status' &&
       github.event.state == 'success' &&
       contains(github.event.context, 'stable-image-mirror'))
    outputs:
      image_tag: ${{ steps.set_image_tag.outputs.tag }}
      checkout_ref: ${{ steps.set_checkout_ref.outputs.ref }}
    steps:
      - name: Get branch information
        if: github.event_name == 'status'
        id: get_branch_info
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          COMMIT_SHA="${{ github.event.sha }}"
          echo "Finding stable branches containing commit: ${COMMIT_SHA}"

          # Get all branches that contain this commit via API
          ALL_BRANCHES=$(gh api "repos/${{ github.repository }}/commits/${COMMIT_SHA}/branches-where-head" --jq '.[].name')

          # Filter for stable and stable-2.x branches explicitly
          STABLE_BRANCHES=$(echo "${ALL_BRANCHES}" | grep -E '^(stable|stable-2\.x)$' || true)

          if [[ -z "${STABLE_BRANCHES}" ]]; then
            echo "No stable branches found containing commit ${COMMIT_SHA}"
            echo "All branches: ${ALL_BRANCHES}"
            exit 1
          fi

          # Check for multiple stable branches
          BRANCH_COUNT=$(echo "${STABLE_BRANCHES}" | wc -l)
          if [[ ${BRANCH_COUNT} -gt 1 ]]; then
            echo "ERROR: Commit ${COMMIT_SHA} found on multiple stable branches"
            echo ""
            echo "Commits should only be cherry-picked to stable branches, not directly pushed to multiple branches."
            exit 1
          fi

          # Use the stable branch
          BRANCH_NAME=$(echo "${STABLE_BRANCHES}" | head -n1)

          echo "branch_name=${BRANCH_NAME}" >> $GITHUB_OUTPUT
          echo "Found branch: ${BRANCH_NAME}"

      - name: Set image tag
        id: set_image_tag
        run: |
          if [[ "${{ github.event_name }}" == "workflow_dispatch" ]]; then
            echo "tag=${{ github.event.inputs.image_tag }}" >> $GITHUB_OUTPUT
          else
            echo "tag=${{ steps.get_branch_info.outputs.branch_name }}" >> $GITHUB_OUTPUT
          fi

      - name: Set checkout ref
        id: set_checkout_ref
        run: |
          if [[ "${{ github.event_name }}" == "workflow_dispatch" ]]; then
            echo "ref=${{ github.event.inputs.test_ref }}" >> $GITHUB_OUTPUT
          else
            echo "ref=${{ github.event.sha }}" >> $GITHUB_OUTPUT
          fi

  # Full functional tests
  functional-tests-all:
    name: Functional Tests (Full)
    runs-on: ubuntu-latest
    needs: setup
    steps:
      - name: Post pending status to commit
        if: github.event_name == 'status'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh api repos/${{ github.repository }}/statuses/${{ needs.setup.outputs.checkout_ref }} \
            -f state=pending \
            -f context="Functional Tests (Full)" \
            -f description="Running full functional tests..." \
            -f target_url="${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"

      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          ref: ${{ needs.setup.outputs.checkout_ref }}

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Pull image from Quay.io
        env:
          IMAGE_TAG: ${{ needs.setup.outputs.image_tag }}
        run: |
          FULL_IMAGE="quay.io/bretthom/openvino_model_server:${IMAGE_TAG}"
          echo "Pulling image: ${FULL_IMAGE}"
          docker pull ${FULL_IMAGE}
          docker tag ${FULL_IMAGE} openvino/model_server:latest

      - name: Run full functional tests
        id: test
        env:
          IMAGE: openvino/model_server:latest
        run: |
          make test_functional

      - name: Post success status to commit
        if: github.event_name == 'status' && success()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh api repos/${{ github.repository }}/statuses/${{ needs.setup.outputs.checkout_ref }} \
            -f state=success \
            -f context="Functional Tests (Full)" \
            -f description="Full functional tests passed" \
            -f target_url="${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"

      - name: Post failure status to commit
        if: github.event_name == 'status' && failure()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh api repos/${{ github.repository }}/statuses/${{ needs.setup.outputs.checkout_ref }} \
            -f state=failure \
            -f context="Functional Tests (Full)" \
            -f description="Full functional tests failed" \
            -f target_url="${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
